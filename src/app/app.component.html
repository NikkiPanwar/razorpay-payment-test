<div class="container">
  <div class="card">
    <h2>Razorpay Payment Test</h2>
    <p class="subtitle">Minimal test integration for your Angular project</p>

    <!-- Key Input -->
    <div class="form-group">
      <label for="key">Razorpay Key ID:</label>
      <input
        id="key"
        type="text"
        [(ngModel)]="razorpayKey"
        placeholder="rzp_test_..."
      />
    </div>

    <!-- Amount Input -->
    <div class="form-group">
      <label for="amount">Amount (INR):</label>
      <input
        id="amount"
        type="number"
        [(ngModel)]="amount"
        min="1"
      />
    </div>

    <!-- Trigger Button -->
    <button class="pay-btn" (click)="payNow()">
      Pay ₹{{ amount }} Now
    </button>

    <!-- Result / Status Box -->
    <div *ngIf="status" class="status-box" [class.success]="paymentId" [class.error]="!paymentId">
      <p><strong>Status:</strong> {{ status }}</p>
      <p *ngIf="paymentId"><strong>Payment ID:</strong> <code>{{ paymentId }}</code></p>
    </div>

    <!-- Quick Test Card Reference -->
    <div class="test-hints">
      <strong>Razorpay Test Card:</strong>
      <p>Number: <code>4012 0000 0000 0002</code> | CVV: <code>123</code> | Exp: Any future date</p>
    </div>
  </div>
</div>
